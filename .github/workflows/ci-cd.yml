name: CloudPulse CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies (auth-service)
        run: cd services/auth-service && npm ci
      - name: Lint auth-service
        run: cd services/auth-service && npm run lint
      - name: Install dependencies (metrics-service)
        run: cd services/metrics-service && npm ci
      - name: Lint metrics-service
        run: cd services/metrics-service && npm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test auth-service
        run: cd services/auth-service && npm ci && npm test
        env:
          MONGO_URI: mongodb://localhost:27017/cloudpulse_test
          JWT_SECRET: test_secret_key
      - name: Test metrics-service
        run: cd services/metrics-service && npm ci && npm test
        env:
          MONGO_URI: mongodb://localhost:27017/cloudpulse_test

  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/auth-service
          push: true
          tags: ghcr.io/adithya-mallepally/cloudpulse-auth:latest
      - name: Build and push metrics-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/metrics-service
          push: true
          tags: ghcr.io/adithya-mallepally/cloudpulse-metrics:latest
      - name: Build and push dashboard
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          push: true
          tags: ghcr.io/adithya-mallepally/cloudpulse-dashboard:latest
