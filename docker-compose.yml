version: "3.9"

networks:
  cloudpulse-net:
    driver: bridge

volumes:
  mongo-data:

services:
  mongodb:
    image: mongo:7
    container_name: cloudpulse-mongo
    restart: always
    volumes:
      - mongo-data:/data/db
    networks:
      - cloudpulse-net
    ports:
      - "27017:27017"

  auth-service:
    build: ./services/auth-service
    container_name: cloudpulse-auth
    restart: always
    environment:
      - MONGO_URI=mongodb://mongodb:27017/cloudpulse
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
      - PORT=3001
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
    networks:
      - cloudpulse-net

  metrics-service:
    build: ./services/metrics-service
    container_name: cloudpulse-metrics
    restart: always
    environment:
      - MONGO_URI=mongodb://mongodb:27017/cloudpulse
      - PORT=3002
    ports:
      - "3002:3002"
    depends_on:
      - mongodb
    networks:
      - cloudpulse-net

  notification-service:
    build: ./services/notification-service
    container_name: cloudpulse-notifications
    restart: always
    environment:
      - MONGO_URI=mongodb://mongodb:27017/cloudpulse
      - PORT=3003
    ports:
      - "3003:3003"
    depends_on:
      - mongodb
    networks:
      - cloudpulse-net

  dashboard:
    build: ./dashboard
    container_name: cloudpulse-dashboard
    restart: always
    environment:
      - REACT_APP_AUTH_URL=http://localhost:3001
      - REACT_APP_METRICS_URL=http://localhost:3002
      - REACT_APP_NOTIF_URL=http://localhost:3003
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - metrics-service
      - notification-service
    networks:
      - cloudpulse-net
